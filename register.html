<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Open an Account | BOA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card" style="max-width: 600px;">
            <div class="auth-header">
                <h2>Open Your Account Online</h2>
                <p style="color:var(--text-muted); font-size:0.9rem;">Fill out the details below to open a new checking
                    account in minutes.</p>
            </div>

            <form id="register-form">
                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-firstName">First Name</label>
                        <input type="text" id="reg-firstName" class="form-control" required placeholder="John">
                    </div>
                    <div class="form-group">
                        <label for="reg-lastName">Last Name</label>
                        <input type="text" id="reg-lastName" class="form-control" required placeholder="Doe">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-email">Email Address</label>
                        <input type="email" id="reg-email" class="form-control" required placeholder="john@example.com">
                    </div>
                    <div class="form-group">
                        <label for="reg-phone">Phone Number</label>
                        <input type="tel" id="reg-phone" class="form-control" required placeholder="+1 (555) 019-2834">
                    </div>
                </div>

                <div class="form-group">
                    <label for="reg-dob">Date of Birth</label>
                    <input type="date" id="reg-dob" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="reg-address">Residential Address</label>
                    <input type="text" id="reg-address" class="form-control" required
                        placeholder="123 Financial Way, Suite 100">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="reg-password">Password</label>
                        <input type="password" id="reg-password" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label for="reg-confirmPassword">Confirm Password</label>
                        <input type="password" id="reg-confirmPassword" class="form-control" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%; margin-top:1rem;">Complete
                    Application</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Sign In</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/email.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
