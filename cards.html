<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Virtual Cards | </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand-header">
                <img src="logo.png" alt="Bank Logo" class="brand-logo"
                    style="height: 36px; width: auto; object-fit: contain;">
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Overview</a>
                <a href="accounts.html" class="nav-item"><i class="fa-solid fa-wallet"></i> Accounts</a>
                <a href="transfer.html" class="nav-item"><i class="fa-solid fa-paper-plane"></i> Transfers</a>
                <a href="transactions.html" class="nav-item"><i class="fa-solid fa-list-check"></i> Transactions</a>
                <a href="bill-pay.html" class="nav-item"><i class="fa-solid fa-file-invoice-dollar"></i> Bill Pay</a>
                <a href="cards.html" class="nav-item active"><i class="fa-solid fa-credit-card"></i> Cards</a>
                <a href="security.html" class="nav-item"><i class="fa-solid fa-shield-halved"></i> Security</a>
                <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle-btn" class="theme-toggle"><i class="fa-solid fa-moon"></i> <span>Dark
                        Mode</span></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <button id="mobile-hamburger" class="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
                <h2 style="font-size:1.1rem;font-weight:700;">My Cards</h2>
                <div class="header-actions">
                    <button id="logout-btn" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <div class="dashboard-body">
                <p style="color:var(--text-muted);font-size:0.9rem;margin-bottom:1rem;">Click <strong>Flip</strong> to
                    see card details. Toggle freeze to lock a card instantly.</p>
                <div class="cards-page-grid" id="cards-render-wrapper"></div>

                <!-- Card security disclaimer -->
                <div class="card-panel"
                    style="margin-top:1.5rem;border-left:4px solid var(--warning);background:rgba(245,158,11,0.04);">
                    <h4 style="margin-bottom:0.5rem;">
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cards.js"></script>
</body>

</html>
