<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transaction History | BOA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>

    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand-header">
                <img src="logo.png" alt="Bank Logo" class="brand-logo"
                    style="height: 36px; width: auto; object-fit: contain;">
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Overview</a>
                <a href="accounts.html" class="nav-item"><i class="fa-solid fa-wallet"></i> Accounts</a>
                <a href="transfer.html" class="nav-item"><i class="fa-solid fa-paper-plane"></i> Transfers</a>
                <a href="transactions.html" class="nav-item active"><i class="fa-solid fa-list-check"></i>
                    Transactions</a>
                <a href="bill-pay.html" class="nav-item"><i class="fa-solid fa-file-invoice-dollar"></i> Bill Pay</a>
                <a href="cards.html" class="nav-item"><i class="fa-solid fa-credit-card"></i> Cards</a>
                <a href="security.html" class="nav-item"><i class="fa-solid fa-shield-halved"></i> Security</a>
            </nav>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <button id="mobile-hamburger" class="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="txn-search-input" placeholder="Search description, reference, or amount...">
                </div>
                <button id="logout-btn" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i></button>
            </header>

            <div class="dashboard-body">
                <div class="card-panel">
                    <div class="panel-header" style="flex-wrap:wrap; gap:1rem;">
                        <h2>Transaction History</h2>
                        <div style="display:flex; gap:0.5rem;">
                            <select id="filter-type" class="form-control" style="width:130px;">
                                <option value="All">All Types</option>
                                <option value="Debit">Debits (-)</option>
                                <option value="Credit">Credits (+)</option>
                            </select>
                            <select id="filter-account" class="form-control" style="width:150px;">
                                <option value="All">All Accounts</option>
                                <option value="Checking">Checking</option>
                                <option value="Savings">Savings</option>
                                <option value="Credit Card">Credit Card</option>
                            </select>
                        </div>
                    </div>

                    <div class="table-wrapper">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Description</th>
                                    <th>Category</th>
                                    <th>Account</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="full-transactions-body">
                                <!-- JS Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/app.js"></script>
    <script src="js/transactions.js"></script>
</body>

</html>
