<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accounts | BOA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand-header">
                <img src="logo.png" alt="Bank Logo" class="brand-logo"
                    style="height: 36px; width: auto; object-fit: contain;">
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Overview</a>
                <a href="accounts.html" class="nav-item active"><i class="fa-solid fa-wallet"></i> Accounts</a>
                <a href="transfer.html" class="nav-item"><i class="fa-solid fa-paper-plane"></i> Transfers</a>
                <a href="transactions.html" class="nav-item"><i class="fa-solid fa-list-check"></i> Transactions</a>
                <a href="bill-pay.html" class="nav-item"><i class="fa-solid fa-file-invoice-dollar"></i> Bill Pay</a>
                <a href="cards.html" class="nav-item"><i class="fa-solid fa-credit-card"></i> Cards</a>
                <a href="deposit.html" class="nav-item"><i class="fa-solid fa-camera"></i> Mobile Deposit</a>
                <a href="beneficiaries.html" class="nav-item"><i class="fa-solid fa-users"></i> Payees</a>
                <div class="nav-divider"></div>
                <a href="notifications.html" class="nav-item"><i class="fa-solid fa-bell"></i> Notifications</a>
                <a href="profile.html" class="nav-item"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="security.html" class="nav-item"><i class="fa-solid fa-shield-halved"></i> Security</a>
                <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
                <a href="help.html" class="nav-item"><i class="fa-solid fa-circle-question"></i> Help</a>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle-btn" class="theme-toggle"><i class="fa-solid fa-moon"></i> <span>Dark
                        Mode</span></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <button id="mobile-hamburger" class="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
                <div class="search-bar">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input type="text" id="global-search" placeholder="Search accounts...">
                </div>
                <div class="header-actions">
                    <a href="notifications.html" class="action-btn"><i class="fa-solid fa-bell"></i><span
                            class="notification-badge" id="notif-count"></span></a>
                    <button id="logout-btn" class="logout-link" title="Sign Out"><i
                            class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <div class="dashboard-body">
                <div class="section-header">
                    <h2>Your Accounts</h2>
                </div>
                <div class="accounts-grid" id="accounts-grid"></div>
            </div>
        </main>
    </div>

    <nav class="mobile-bottom-bar">
        <a href="dashboard.html" class="mobile-nav-btn"><i class="fa-solid fa-house"></i> Home</a>
        <a href="accounts.html" class="mobile-nav-btn active"><i class="fa-solid fa-wallet"></i> Accounts</a>
        <a href="transfer.html" class="mobile-nav-btn"><i class="fa-solid fa-paper-plane"></i> Transfer</a>
        <a href="transactions.html" class="mobile-nav-btn"><i class="fa-solid fa-list-check"></i> Activity</a>
        <a href="profile.html" class="mobile-nav-btn"><i class="fa-solid fa-user"></i> Profile</a>
    </nav>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/app.js"></script>
    <script src="js/accounts.js"></script>
</body>

</html>
