<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Horizon Digital Bank Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="brand-header" style="justify-content: center; padding: 0; border: none;">
                    <img src="logo.png" alt="Bank Logo" class="brand-logo"
                        style="height: 36px; width: auto; object-fit: contain;">
                </div>
                <h2>Secure Online Banking</h2>
            </div>

            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" class="form-control" value="" required
                        placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" class="form-control" value="" required>
                        <button type="button" class="toggle-password-btn"
                            onclick="SecurityEngine.togglePasswordVisibility(document.getElementById('password'), this.querySelector('i'))">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div
                    style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem; font-size:0.85rem;">
                    <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
                        <input type="checkbox" checked> Remember me
                    </label>
                    <a href="forgot-password.html">Forgot password?</a>
                </div>

                <button type="submit" class="btn btn-primary" style="width:100%;">Sign In</button>
            </form>

            <div class="auth-footer">
                Don't have an online banking profile? <a href="register.html">Open an account</a>
            </div>
        </div>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/email.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
