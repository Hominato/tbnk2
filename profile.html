<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | </title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <div class="app-shell">
        <aside class="sidebar" id="sidebar">
            <div class="brand-header">
                <img src="logo.png" alt="Bank Logo" class="brand-logo"
                    style="height: 36px; width: auto; object-fit: contain;">
            </div>
            <nav class="sidebar-nav">
                <a href="dashboard.html" class="nav-item"><i class="fa-solid fa-chart-pie"></i> Overview</a>
                <a href="accounts.html" class="nav-item"><i class="fa-solid fa-wallet"></i> Accounts</a>
                <a href="profile.html" class="nav-item active"><i class="fa-solid fa-user"></i> Profile</a>
                <a href="security.html" class="nav-item"><i class="fa-solid fa-shield-halved"></i> Security</a>
                <a href="notifications.html" class="nav-item"><i class="fa-solid fa-bell"></i> Notifications</a>
                <a href="settings.html" class="nav-item"><i class="fa-solid fa-gear"></i> Settings</a>
                <a href="help.html" class="nav-item"><i class="fa-solid fa-circle-question"></i> Help</a>
            </nav>
            <div class="sidebar-footer">
                <button id="theme-toggle-btn" class="theme-toggle"><i class="fa-solid fa-moon"></i> <span>Dark
                        Mode</span></button>
            </div>
        </aside>

        <main class="main-content">
            <header class="top-header">
                <button id="mobile-hamburger" class="hamburger-btn"><i class="fa-solid fa-bars"></i></button>
                <h2 style="font-size:1.1rem;font-weight:700;">My Profile</h2>
                <div class="header-actions">
                    <button id="logout-btn" class="logout-link"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <div class="dashboard-body" style="max-width:720px;">
                <div class="card-panel">
                    <!-- Avatar Section -->
                    <div class="avatar-uploader">
                        <img id="profile-avatar" src="" alt="Profile Photo" class="avatar-large">
                        <div>
                            <h3 id="profile-full-name">Loading...</h3>
                            <p style="font-size:0.82rem;color:var(--text-muted);" id="profile-customer-id">Customer ID:
                                —</p>
                        </div>
                    </div>

                    <h4 style="margin-bottom:1rem;padding-top:1rem;border-top:1px solid var(--border-color);">Personal
                        Information</h4>
                    <form id="profile-form">
                        <div class="form-row">
                            <div class="form-group">
                                <label for="pf-firstName">First Name</label>
                                <input type="text" id="pf-firstName" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="pf-lastName">Last Name</label>
                                <input type="text" id="pf-lastName" class="form-control" required>
                            </div>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="pf-email">Email Address</label>
                                <input type="email" id="pf-email" class="form-control" required>
                            </div>
                            <div class="form-group">
                                <label for="pf-phone">Phone Number</label>
                                <input type="tel" id="pf-phone" class="form-control">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="pf-dob">Date of Birth</label>
                            <input type="date" id="pf-dob" class="form-control">
                        </div>
                        <div class="form-group">
                            <label for="pf-address">Residential Address</label>
                            <input type="text" id="pf-address" class="form-control">
                        </div>
                        <button type="submit" class="btn btn-primary"><i class="fa-solid fa-floppy-disk"></i> Save
                            Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/security.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const user = SecurityEngine.verifySession();
            if (!user) return;

            // Populate avatar and name
            document.getElementById("profile-avatar").src = `https://ui-avatars.com/api/?name=${user.firstName}+${user.lastName}&background=0061C1&color=fff&size=160`;
            document.getElementById("profile-full-name").textContent = `${user.firstName} ${user.lastName}`;
            document.getElementById("profile-customer-id").textContent = `Customer ID: ${user.id} | Member since ${new Date(user.registeredAt).getFullYear()}`;

            // Populate form
            document.getElementById("pf-firstName").value = user.firstName;
            document.getElementById("pf-lastName").value = user.lastName;
            document.getElementById("pf-email").value = user.email;
            document.getElementById("pf-phone").value = user.phone || "";
            document.getElementById("pf-dob").value = user.dob || "";
            document.getElementById("pf-address").value = user.address || "";

            document.getElementById("profile-form").addEventListener("submit", (e) => {
                e.preventDefault();
                const updated = {
                    ...user,
                    firstName: document.getElementById("pf-firstName").value.trim(),
                    lastName: document.getElementById("pf-lastName").value.trim(),
                    email: document.getElementById("pf-email").value.trim(),
                    phone: document.getElementById("pf-phone").value.trim(),
                    dob: document.getElementById("pf-dob").value,
                    address: document.getElementById("pf-address").value.trim()
                };
                StorageEngine.updateItem(DB_KEYS.USERS, user.id, updated);
                sessionStorage.setItem(DB_KEYS.SESSION, JSON.stringify(updated));
                document.getElementById("profile-full-name").textContent = `${updated.firstName} ${updated.lastName}`;
                document.getElementById("profile-avatar").src = `https://ui-avatars.com/api/?name=${updated.firstName}+${updated.lastName}&background=0061C1&color=fff&size=160`;
                Utils.showToast("Profile updated successfully!", "success");
            });
        });
    </script>
</body>

</html>
